version: 2
updates:
  - package-ecosystem: mix
    directory: /guardrails
    schedule:
      interval: weekly
    groups:
      mix:
        patterns:
          - "*"
  - package-ecosystem: mix
    directory: /ui
    schedule:
      interval: weekly
    groups:
      mix-ui:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
