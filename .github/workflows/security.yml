name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  # Which packages the change touches (.github/actions/changes): a pull
  # request that changes only prose skips the jobs below, and a skipped job
  # still satisfies a required check. If this job fails, they all run: a job
  # skipped for a failure would satisfy its required check too.
  changes:
    name: Security changes
    runs-on: ubuntu-latest
    outputs:
      guardrails: ${{ steps.changes.outputs.guardrails }}
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changes
        uses: ./.github/actions/changes

  elixir-audit:
    name: Elixir Security Audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.guardrails == 'true') }}
    runs-on: ubuntu-latest

    # Toolchain from the flake's dev shell (flake.nix), same as CI and local dev.
    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: guardrails

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            guardrails/deps
            guardrails/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('guardrails/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

      # No Sobelow: it scans Phoenix apps, and heartwood_guardrails isn't one.

  ui-elixir-audit:
    name: heartwood_ui Elixir Security Audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ui/deps
            ui/_build
          key: ${{ runner.os }}-mix-ui-${{ hashFiles('flake.lock') }}-${{ hashFiles('ui/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-ui-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

  # The npm packages are heartwood_ui's test tools only; the apps never load them.
  ui-npm-audit:
    name: heartwood_ui npm Audit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Audit npm packages for vulnerabilities
        run: npm audit
