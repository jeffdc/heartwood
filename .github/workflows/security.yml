name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  elixir-audit:
    name: Elixir Security Audit
    runs-on: ubuntu-latest

    # Toolchain from the flake's dev shell (flake.nix), same as CI and local dev.
    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: guardrails

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            guardrails/deps
            guardrails/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('guardrails/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

      # No Sobelow: it scans Phoenix apps, and heartwood_guardrails isn't one.
