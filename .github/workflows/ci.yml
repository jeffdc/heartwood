name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Toolchain comes from the flake's dev shell (flake.nix), the same one used locally.
# Steps run through `nix develop`; the shell is pre-built in its own step so a broken
# shell fails clearly and doesn't skew step timings.

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  # Which packages the change touches (guardrails/actions/changes, with
  # HEARTWOOD_CI_AREAS from dev/guardrails/config.sh): a pull request that
  # changes only prose skips the jobs below, and a skipped job still
  # satisfies a required check. If this job fails, they all run: a job
  # skipped for a failure would satisfy its required check too.
  changes:
    name: CI changes
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.changes.outputs.areas }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # main's classifier, not the pull request's: a pull request that changes
      # the classifier is never classified by it (HEARTWOOD_CI_ALL then runs
      # everything). Until main has it, the job fails and everything runs.
      - id: changes
        uses: jeffdc/heartwood/guardrails/actions/changes@main
        with:
          expect: guardrails ui

  # The pull request's own copy of the classifier's action, which the jobs
  # above don't use: a broken one shows here before it's merged or tagged.
  # Nothing depends on it, and it isn't a required check.
  changes-action:
    name: CI changes action (this branch)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./guardrails/actions/changes
        with:
          expect: guardrails ui

  guardrails:
    name: heartwood_guardrails
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.areas).guardrails) }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: guardrails

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            guardrails/deps
            guardrails/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('guardrails/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run precommit checks (format, compile, credo, unused deps, tests)
        run: mix precommit

  # A separate job so the PLT cache (guardrails/priv/plts) can key on its own; it's
  # rebuilt only when deps or the toolchain change.
  dialyzer:
    name: Dialyzer
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.areas).guardrails) }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: guardrails

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies and PLT cache
        uses: actions/cache@v6
        with:
          path: |
            guardrails/deps
            guardrails/_build
            guardrails/priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('flake.lock') }}-${{ hashFiles('guardrails/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --format github --format dialyxir

  ui:
    name: heartwood_ui
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.areas).ui) }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ui/deps
            ui/_build
          key: ${{ runner.os }}-mix-ui-${{ hashFiles('flake.lock') }}-${{ hashFiles('ui/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-ui-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run precommit checks (format, compile, credo, unused deps, tests)
        run: mix precommit

  ui-dialyzer:
    name: heartwood_ui Dialyzer
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.areas).ui) }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies and PLT cache
        uses: actions/cache@v6
        with:
          path: |
            ui/deps
            ui/_build
            ui/priv/plts
          key: ${{ runner.os }}-dialyzer-ui-${{ hashFiles('flake.lock') }}-${{ hashFiles('ui/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-ui-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: |
          mkdir -p priv/plts
          mix dialyzer --format github --format dialyxir

  # heartwood_ui's components in Chromium, against the preview (dev.exs) with
  # its generated photos. Playwright's browser comes from npm, with the system
  # libraries it needs from apt.
  ui-browser:
    name: heartwood_ui browser tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.areas).ui) }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        working-directory: .
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ui/deps
            ui/_build
            ~/.npm
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-browser-ui-${{ hashFiles('flake.lock') }}-${{ hashFiles('ui/mix.lock') }}-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-browser-ui-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: |
          mix deps.get
          npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the browser tests
        env:
          CI: "true"
        run: npm test

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: ui/test-results/
          retention-days: 7
