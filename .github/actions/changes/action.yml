name: Changes
description: >
  Which packages the pull request's code changes touch (changes.sh), so CI
  skips what it doesn't need. Anything but a pull request touches both.
  Needs the repository checked out with the base commit (fetch-depth: 0).

outputs:
  guardrails:
    description: "true when heartwood_guardrails' jobs should run"
    value: ${{ steps.changes.outputs.guardrails }}
  ui:
    description: "true when heartwood_ui's jobs should run"
    value: ${{ steps.changes.outputs.ui }}

runs:
  using: composite
  steps:
    - name: Test the classifier
      shell: bash
      run: ${{ github.action_path }}/test.sh

    - id: changes
      name: Find the packages touched
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "$EVENT" != "pull_request" ]; then
          printf 'guardrails=true\nui=true\n' >> "$GITHUB_OUTPUT"
        else
          "$GITHUB_ACTION_PATH/changes.sh" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
        fi
